# Google's Gemini CLI (docs/adapter-format.md): facts only, nothing in this file runs.
command = "gemini"
name = "Gemini CLI"
label = "Gemini"
full_name = "Gemini CLI"
icon = "U+F0AE2"
homepage = "https://github.com/google-gemini/gemini-cli"
data = ["~/.gemini"]
home = "~/.gemini"
activity = ["~/.gemini/tmp"]
web_search = true                      # searches the web itself (no MCP server needed)

[details]                              # its model: settings.json's, else its newest session's
reader = "gemini"

[[install]]
kind = "mise"
spec = "gemini"

[sessions]
reader = "gemini-files"           # a reader the app has (~/.gemini/tmp/<project>/chats)
note = "Numbers from {0}'s session files (no text is read). The API value is what the tokens would cost at API prices, not what a plan costs."
note_args = ["Gemini CLI"]

[skills]
dirs = ["~/.gemini/skills", "~/.agents/skills"]
own = "~/.gemini/skills"

[mcp]
path = "~/.gemini/settings.json"
shape = "gemini"

[access]
how = "A Google account (free tier), or an API key from aistudio.google.com"
login = "gemini"
files = [".gemini/oauth_creds.json", ".gemini/.env"]
env = ["GEMINI_API_KEY", "GOOGLE_API_KEY"]

[[access.logins]]
label = "Google account"
argv = ["gemini"]
note = "Choose “Sign in with Google” when it asks."

[access.key]
var = "GEMINI_API_KEY"
url = "https://aistudio.google.com/apikey"
env_file = "~/.gemini/.env"

# The AI helper of the other Maprisma apps (tools/export-helpers.py -> data/helpers.json, docs/adapter-format.md).

[ask]                                  # one prompt, one answer: in "default" approval mode a tool that needs
                                       # approval is denied without a terminal; plan mode is not used (it
                                       # switches to YOLO when it leaves the plan in headless runs)
# Source: https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/cli-reference.md (-p, -o, --approval-mode),
# docs/reference/policy-engine.md ("In non-interactive mode, this is treated as deny"), docs/cli/plan-mode.md
argv = ["gemini", "--approval-mode", "default", "-o", "text", "-p", "{prompt}"]
verified = false                       # documentation only, not yet tried with it
# Not a helper (2026-11-13, Codex review): "default" denies only tools that need approval; read tools
# (read_file, glob, grep, web_fetch) still run, and the user's own policy files can allow more, so a
# prompt-injected mail or app description could pull private files into the answer. Plan mode reads
# files too and turns into YOLO when it leaves the plan headless. Until a verified tool-free mode exists:
helper = false

[task]                                 # interactive, with a first prompt (-i, --prompt-interactive)
# Source: https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/cli-reference.md
argv = ["gemini", "-i", "{prompt}"]
verified = false
