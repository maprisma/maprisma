name: maprisma
description: Maprisma desktop frontend.
publish_to: none
version: 0.12.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  maprisma_core:
    path: ../packages/maprisma_core
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  xterm: ^4.0.0
  file_selector: ^1.1.0
  window_manager: ^0.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/translations/
